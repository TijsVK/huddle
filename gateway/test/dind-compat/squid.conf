# Permissive forward proxy standing in for the Huddle egress gateway in Tier-2
# tests. Allows HTTP + CONNECT (TLS) to anywhere so we can prove tools work when
# ALL egress is forced through a proxy on an --internal network. (Real Huddle
# additionally applies its per-domain firewall; here we only test the proxy path.)
http_port 3128
acl CONNECT method CONNECT
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
http_access deny CONNECT !SSL_ports
http_access allow all
coredump_dir /var/spool/squid
dns_v4_first on
